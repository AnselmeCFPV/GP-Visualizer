<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Prenois — Visualisation circuit</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 100%; height: 100%; overflow: hidden; background: #0a0e14; }
      #grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        grid-template-rows: 1fr 1fr;
        width: 100%;
        height: 100%;
        gap: 2px;
        background: #0a0e14;
      }
      .view {
        position: relative;
        min-height: 0;
        background: #111820;
      }
      .view-label {
        position: absolute;
        top: 8px;
        left: 8px;
        z-index: 5;
        color: #e8ecf0;
        font: 11px/1.4 'Segoe UI', system-ui, sans-serif;
        background: rgba(10, 14, 20, 0.78);
        padding: 6px 10px;
        border-radius: 6px;
        border: 1px solid rgba(255,255,255,0.08);
        pointer-events: none;
      }
      .view-label strong { font-size: 12px; }
      .hud {
        position: fixed;
        top: 12px;
        right: 12px;
        color: #e8ecf0;
        font: 12px/1.5 'Segoe UI', system-ui, sans-serif;
        background: rgba(10, 14, 20, 0.82);
        padding: 10px 14px;
        border-radius: 8px;
        border: 1px solid rgba(255,255,255,0.08);
        pointer-events: none;
        z-index: 10;
        max-width: 280px;
      }
      .hud kbd {
        background: rgba(255,255,255,0.1);
        padding: 1px 5px;
        border-radius: 3px;
        font-size: 11px;
      }
      .rider-line { opacity: 0.85; font-size: 11px; }
    </style>
  </head>
  <body>
    <div id="grid">
      <div class="view" id="view-leader">
        <span class="view-label"><strong>Leader</strong> · spectateur</span>
      </div>
      <div class="view" id="view-tv">
        <span class="view-label"><strong>TV</strong> · orbite pilote 1</span>
      </div>
      <div class="view" id="view-p4">
        <span class="view-label"><strong>P4</strong> · 1ère personne</span>
      </div>
      <div class="view" id="view-track">
        <span class="view-label"><strong>Circuit</strong> · orbite lente</span>
      </div>
    </div>
    <div class="hud" id="hud"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
